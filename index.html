<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قرشين</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F8;--card:#fff;--tx:#1B1C3A;--mut:#6B6F8A;--pri:#2B2D6E;--acc:#F5A524;--exp:#D6455D;--inc:#1E9E6A;--line:#E3E5EE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12131F;--card:#1D1F33;--tx:#EEF0FA;--mut:#9A9EBB;--pri:#8E91F0;--line:#2D3050}}
:root[data-theme=dark]{--bg:#12131F;--card:#1D1F33;--tx:#EEF0FA;--mut:#9A9EBB;--pri:#8E91F0;--line:#2D3050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:4px 0 14px;font-weight:800}h3{margin:18px 0 8px;font-size:16px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.hero{background:var(--pri);color:#fff;border:0}.hero small{opacity:.75}.big{font-size:34px;font-weight:800;margin:2px 0 10px}
.hero .cols{display:flex;gap:10px}.hero .cols div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;font-size:13px}.hero b{display:block;font-size:16px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}.grow small{color:var(--mut);display:block}
.e{color:var(--exp);font-weight:700}.i{color:var(--inc);font-weight:700}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;min-width:56px}nav button span{font-size:20px}nav button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#1B1C3A;border:0;font-size:32px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.btn,.ghost{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;flex:1}.btn{background:var(--pri);color:#fff}.ghost{background:var(--bg);color:var(--tx)}
.sm{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:5px 10px}
input,select{width:100%;font:inherit;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin-bottom:8px}
label{font-size:13px;color:var(--mut)}.row{display:flex;gap:8px;margin-top:6px}
#M{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:flex-end}#M.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}.sheet h3{margin-top:0}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;margin:8px 0}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mut)}.bars i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
.prog{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--inc)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;font:inherit;padding:8px;border-radius:10px;color:var(--mut)}.seg .on{background:var(--card);color:var(--tx);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:13px;border-radius:20px;padding:6px 12px}.chips .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.menu{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;font:inherit;color:var(--tx);text-align:start}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;max-width:488px;margin:0 auto;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:14px;z-index:40;font-size:14px}
.empty{color:var(--mut);text-align:center;padding:18px 6px;font-size:14px}
#L{display:none;position:fixed;inset:0;background:var(--pri);color:#fff;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:18px}#L.show{display:flex}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px;direction:ltr}.pad button{height:70px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font:inherit;font-size:26px}
.dcards{display:flex;gap:10px}.dc{flex:1;border-radius:18px;padding:14px}.dc small{display:block;opacity:.85}.dc b{font-size:20px}.dc.o{background:rgba(214,69,93,.14);color:var(--exp)}.dc.l{background:rgba(30,158,106,.14);color:var(--inc)}.dbar{height:8px;background:var(--exp);border-radius:6px;overflow:hidden;margin:10px 0}.dbar i{display:block;height:100%;background:var(--inc)}
</style>
</head>
<body>
<div id="app"></div><div id="M"></div><div id="L"></div>

en:{home:'Home',report:'Report',plans:'Plans',more:'More',bal:"This month's balance",inc:'Income',exp:'Expenses',recent:'Recent transactions',none:'Nothing yet. Tap + to add your first expense.',add:'Add transaction',type:'Type',expense:'Expense',income:'Income',amt:'Amount',cat:'Category',acc:'Account',note:'Note (optional)',date:'Date',save:'Save',cancel:'Cancel',del:'Delete',week:'Week',month:'Month',all:'All',total:'Total spent',bills:'Monthly commitments',goals:'Goals',addBill:'Add commitment',addGoal:'Add goal',name:'Name',day:'Due day (1-31)',target:'Target amount',saved:'Saved',pay:'Pay',paid:'Paid',due:'Due on day',deposit:'Add money',upcoming:'Upcoming commitments',cats:'Categories',accs:'Accounts (salary, side income...)',addCat:'Add category',addAcc:'Add account',icon:'Icon (emoji)',lang:'اللغة / Language',lock:'App passcode lock',lockOn:'On',lockOff:'Off',pin:'4-digit code',rem:'Reminders',addRem:'Add reminder',time:'Time',label:'Reminder text',share:'Share the app',about:'About',cur:'Currency',enter:'Enter passcode',wrong:'Wrong passcode',noRem:'Log your expenses before you forget!',noToday:'No expenses logged today. Add one now?',copied:'Link copied',aboutTxt:'"Qirshain" answers one question: where did my salary go? Log daily spending, track monthly commitments and goals, and see your weekly report at a glance. Your data stays on your phone.',dev:'About the developer',devTxt:'Developer: Ramzi Alyafei. Built to make money management simple. Contact the developer for feedback.',edit:'Edit',by:'Notifications work while the app is open',weekly:'Period report',byCat:'By category',left:'left',freq:'Repeat',monthly:'Monthly',yearly:'Yearly',amtPer:'Installment / payment amount',mon:'Due month (1-12) for yearly',totalInst:'Total (leave empty for open-ended)',paidSoFar:'Paid',finished:'Completed',debts:'Debts & loans',addDebt:'Add debt',iOwe:'I owe:',owedMe:'Owed to me:',owe:'I owe',lent:'Owed to me',payDebt:'Pay',collect:'Collect',who:'Name (person or company)',paidAmt:'Paid so far',dueDate:'Due date',budget:'Monthly budget (optional)',budgets:'Category budgets',accBal:'Account balances',vsPrev:'vs previous period:',auto:'Auto-log when due',theme:'Appearance',themeA:'Auto',themeL:'Light',themeD:'Dark',color:'App color',def:'Default',backup:'Backup (export)',restore:'Restore backup',backed:'Backup saved and copied to clipboard',restored:'Restored',badFile:'Invalid file',bkRem:'It has been a while since your last backup. Back up from More',search:'Search by name or amount',budWarn:'Nearing budget:',budOver:'Over budget:',youOwe:'You owe',youGet:'You will receive',addPerson:'Add person',recsN:'records',fAll:'All',fLent:'Owed to me',fOwe:'I owe',fArch:'Archived',dsearch:'Search people...',phone:'Phone, international format, no + (optional)',addRec:'Add record',remind:'WhatsApp reminder',net:'Net',settled:'Settled',dts:'Debts',sepNote:'A fully separate ledger: paying or collecting a debt never affects your balance or expenses.'}};
const DEF={lang:'ar',cur:'ر.س',pin:'',tab:'home',
cats:[{id:'c1',ar:'البقالة',en:'Groceries',ic:'🛒'},{id:'c2',ar:'أغراض المنزل',en:'Household',ic:'🏠'},{id:'c3',ar:'السيارة',en:'Car',ic:'🚗'},{id:'c4',ar:'مطاعم وقهوة',en:'Food & coffee',ic:'☕'},{id:'c5',ar:'فواتير وخدمات',en:'Bills & services',ic:'💡'},{id:'c6',ar:'صحة',en:'Health',ic:'💊'},{id:'c7',ar:'أخرى',en:'Other',ic:'📦'}],
accs:[{id:'a1',ar:'الراتب',en:'Salary'},{id:'a2',ar:'دخل إضافي',en:'Side income'}],
tx:[],bills:[],goals:[],debts:[],rems:[{id:'r1',time:'21:00',label:'',on:true}]};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('masrouf')||'{}'))}catch(e){S=JSON.parse(JSON.stringify(DEF))}
const save=()=>{try{localStorage.setItem('masrouf',JSON.stringify(S))}catch(e){}};
const t=k=>T[S.lang][k]||k;const nm=o=>o[S.lang]||o.ar;
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2})+' '+S.cur;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());const ym=()=>today().slice(0,7);
const cat=id=>S.cats.find(c=>c.id==id)||{ar:'—',en:'—',ic:'•'};
let tab=S.tab,off=0,rng='week',fcat='all',q='';
function applyTheme(){const r=document.documentElement;S.theme&&S.theme!='auto'?r.setAttribute('data-theme',S.theme):r.removeAttribute('data-theme');S.color?r.style.setProperty('--pri',S.color):r.style.removeProperty('--pri')}
function themeCycle(){S.theme=({auto:'light',light:'dark',dark:'auto'})[S.theme||'auto'];save();go()}
function colorForm(){form(t('color'),[{k:'c',l:t('color'),v:S.color||'',o:[['',t('def')],['#5457D6','🟣'],['#0F8B8D','🔵'],['#2E9E5B','🟢'],['#D6456F','🔴']]}],v=>{S.color=v.c})}
function backup(){const j=JSON.stringify(S);try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='qirshain-'+today()+'.json';a.click()}catch(e){}try{navigator.clipboard.writeText(j)}catch(e){}S.lb=today();save();toast(t('backed'));go()}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tx||!d.cats)throw 0;S=Object.assign({},DEF,d);migrateDebts();save();go();toast(t('restored'))}catch(e){toast(t('badFile'))}};r.readAsText(i.files[0])};i.click()}
function chk(r){if(r.type!='exp')return;const c=cat(r.cat);if(!c.budget)return;const s=S.tx.filter(x=>x.type=='exp'&&x.cat==r.cat&&x.date.slice(0,7)==ym()).reduce((a,x)=>a+x.amt,0);if(s>=c.budget)toast('⚠️ '+t('budOver')+' '+nm(c));else if(s>=c.budget*.8)toast('⚠️ '+t('budWarn')+' '+nm(c))}
function autoPost(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();let ch=0;S.bills.forEach(b=>{if(b.auto!='1'||paid(b))return;if(b.freq=='yearly'&&b.mon-1!=m)return;const d=Math.min(b.day,new Date(y,m+1,0).getDate());if(n.getDate()<d)return;S.tx.push({id:uid(),type:'exp',amt:b.total>0?Math.min(b.amt,rem(b)):b.amt,cat:b.cat,acc:S.accs[0]?.id,note:b.name,date:ymd(new Date(y,m,d)),bill:b.id});ch=1});if(ch)save()}
function accsHTML(){return '<div class="card"><b>'+t('accBal')+'</b><div class="chips" style="flex-wrap:wrap;margin-top:8px">'+S.accs.map(a=>{const v=S.tx.filter(x=>x.acc==a.id).reduce((s,x)=>s+(x.type=='inc'?x.amt:-x.amt),0);return '<button style="cursor:default">'+nm(a)+': <b class="'+(v<0?'e':'i')+'">'+fmt(v)+'</b></button>'}).join('')+'</div></div>'}
function budgetsHTML(){const l=S.cats.filter(c=>c.budget>0);if(!l.length)return '';return '<div class="card"><b>'+t('budgets')+'</b>'+l.map(c=>{const s=S.tx.filter(x=>x.type=='exp'&&x.cat==c.id&&x.date.slice(0,7)==ym()).reduce((a,x)=>a+x.amt,0),p=s/c.budget;return '<div class="item" style="display:block"><div class="row" style="margin:0;justify-content:space-between"><span>'+c.ic+' '+nm(c)+'</span><small>'+fmt(s)+' / '+fmt(c.budget)+'</small></div><div class="prog"><i style="width:'+Math.min(100,p*100)+'%;background:'+(p>=1?'var(--exp)':p>=.8?'var(--acc)':'var(--inc)')+'"></i></div></div>'}).join('')+'</div>'}
function cmp(a,tot){const P=rng=='week'?[new Date(a.getFullYear(),a.getMonth(),a.getDate()-7),new Date(a.getFullYear(),a.getMonth(),a.getDate()-1)]:[new Date(a.getFullYear(),a.getMonth()-1,1),new Date(a.getFullYear(),a.getMonth(),0)];const pt=S.tx.filter(x=>x.type=='exp'&&x.date>=ymd(P[0])&&x.date<=ymd(P[1])&&(fcat=='all'||x.cat==fcat)).reduce((s,x)=>s+x.amt,0);if(!pt)return '';const d=Math.round((tot-pt)/pt*100);return '<small style="color:var(--mut)">'+t('vsPrev')+' <b class="'+(d>0?'e':'i')+'">'+(d>0?'+':'')+d+'%</b> ('+fmt(pt)+')</small>'}
function setLang(){applyTheme();document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';document.title=S.lang=='ar'?'قرشين':'Qirshain'}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function closeM(){$('M').className=''}
function form(title,fields,cb,extra){$('M').innerHTML='<div class="sheet"><h3>'+title+'</h3>'+fields.map(f=>'<label>'+f.l+'</label>'+(f.o?'<select id="f_'+f.k+'">'+f.o.map(o=>'<option value="'+o[0]+'"'+(o[0]==f.v?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>':'<input id="f_'+f.k+'" type="'+(f.t||'text')+'" value="'+(f.v??'')+'"'+(f.t=='number'?' inputmode="decimal"':'')+(f.m?' maxlength="'+f.m+'"':'')+'>')).join('')+'<div class="row"><button class="btn" onclick="_ok()">'+t('save')+'</button>'+(extra?'<button class="ghost" style="color:var(--exp)" onclick="_x()">'+t('del')+'</button>':'')+'<button class="ghost" onclick="closeM()">'+t('cancel')+'</button></div></div>';$('M').className='show';
window._ok=()=>{const v={};fields.forEach(f=>v[f.k]=$('f_'+f.k).value.trim());if(cb(v)!==false){save();closeM();go()}};window._x=()=>{extra();save();closeM();go()}}

form(x?t('edit'):t('add'),[{k:'type',l:t('type'),v:o.type,o:[['exp',t('expense')],['inc',t('income')]]},{k:'amt',l:t('amt'),t:'number',v:o.amt},{k:'cat',l:t('cat'),v:o.cat,o:S.cats.map(c=>[c.id,c.ic+' '+nm(c)])},{k:'acc',l:t('acc'),v:o.acc,o:S.accs.map(a=>[a.id,nm(a)])},{k:'note',l:t('note'),v:o.note||''},{k:'date',l:t('date'),t:'date',v:o.date}],v=>{if(!(+v.amt>0))return false;const r={id:o.id||uid(),type:v.type,amt:+v.amt,cat:v.cat,acc:v.acc,note:v.note,date:v.date||today()};if(x)Object.assign(x,r);else S.tx.push(r);chk(r)},x?()=>{S.tx=S.tx.filter(y=>y.id!=x.id)}:null)}

async function share(){const d={title:S.lang=='ar'?'قرشين':'Qirshain',text:S.lang=='ar'?'جرّب تطبيق قرشين لإدارة المصروف':'Try Qirshain expense tracker',url:location.href};try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(d.url);toast(t('copied'))}}catch(e){}}
let buf='';function lockUI(){$('L').className='show';$('L').innerHTML='<div style="font-size:42px">🔒</div><div>'+t('enter')+'</div><div class="dots">'+[0,1,2,3].map(i=>'<i class="'+(i<buf.length?'f':'')+'"></i>').join('')+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>'<button '+(k===''?'style="visibility:hidden"':'')+' onclick="key(\''+k+'\')">'+k+'</button>').join('')+'</div>'}
function key(k){if(k=='⌫')buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;if(buf.length==4){if(buf==S.pin){buf='';$('L').className='';return}buf='';toast(t('wrong'))}lockUI()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.pin){buf='';lockUI()}});
