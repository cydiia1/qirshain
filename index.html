<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قرشين</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F8;--card:#fff;--tx:#1B1C3A;--mut:#6B6F8A;--pri:#2B2D6E;--acc:#F5A524;--exp:#D6455D;--inc:#1E9E6A;--line:#E3E5EE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12131F;--card:#1D1F33;--tx:#EEF0FA;--mut:#9A9EBB;--pri:#8E91F0;--line:#2D3050}}
:root[data-theme=dark]{--bg:#12131F;--card:#1D1F33;--tx:#EEF0FA;--mut:#9A9EBB;--pri:#8E91F0;--line:#2D3050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:520px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:4px 0 14px;font-weight:800}h3{margin:18px 0 8px;font-size:16px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.hero{background:var(--pri);color:#fff;border:0}.hero small{opacity:.75}.big{font-size:34px;font-weight:800;margin:2px 0 10px}
.hero .cols{display:flex;gap:10px}.hero .cols div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;font-size:13px}.hero b{display:block;font-size:16px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}.grow small{color:var(--mut);display:block}
.e{color:var(--exp);font-weight:700}.i{color:var(--inc);font-weight:700}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;min-width:56px}nav button span{font-size:20px}nav button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#1B1C3A;border:0;font-size:32px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.btn,.ghost{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;flex:1}.btn{background:var(--pri);color:#fff}.ghost{background:var(--bg);color:var(--tx)}
.sm{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:5px 10px}
input,select{width:100%;font:inherit;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin-bottom:8px}
label{font-size:13px;color:var(--mut)}.row{display:flex;gap:8px;margin-top:6px}
#M{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:flex-end}#M.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}.sheet h3{margin-top:0}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;margin:8px 0}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mut)}.bars i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
.prog{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--inc)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;font:inherit;padding:8px;border-radius:10px;color:var(--mut)}.seg .on{background:var(--card);color:var(--tx);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:13px;border-radius:20px;padding:6px 12px}.chips .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.menu{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;font:inherit;color:var(--tx);text-align:start}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;max-width:488px;margin:0 auto;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:14px;z-index:40;font-size:14px}
.empty{color:var(--mut);text-align:center;padding:18px 6px;font-size:14px}
#L{display:none;position:fixed;inset:0;background:var(--pri);color:#fff;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:18px}#L.show{display:flex}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px;direction:ltr}.pad button{height:70px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font:inherit;font-size:26px}
.dcards{display:flex;gap:10px}.dc{flex:1;border-radius:18px;padding:14px}.dc small{display:block;opacity:.85}.dc b{font-size:20px}.dc.o{background:rgba(214,69,93,.14);color:var(--exp)}.dc.l{background:rgba(30,158,106,.14);color:var(--inc)}.dbar{height:8px;background:var(--exp);border-radius:6px;overflow:hidden;margin:10px 0}.dbar i{display:block;height:100%;background:var(--inc)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.tile{border-radius:12px;padding:10px;color:#fff}.tile small{display:block;opacity:.9}.tile b{font-size:15px}.tile.add{background:none!important;border:1px dashed var(--pri);color:var(--pri);display:grid;place-items:center;font-size:13px}
</style>
</head>

function chk(r){if(r.type!='exp')return;allBudgets().filter(b=>bIn(b,r)).forEach(b=>{const v=bSpent(b);if(v>=b.amt)toast('⚠️ '+t('budOver')+' '+b.name);else if(v>=b.amt*0.8)toast('⚠️ '+t('budWarn')+' '+b.name)})}
function autoPost(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();let ch=0;S.bills.forEach(b=>{if(b.auto!='1'||paid(b))return;if(b.freq=='yearly'&&b.mon-1!=m)return;const d=Math.min(b.day,new Date(y,m+1,0).getDate());if(n.getDate()<d)return;S.tx.push({id:uid(),type:'exp',amt:b.total>0?Math.min(b.amt,rem(b)):b.amt,cat:b.cat,acc:S.accs[0]?.id,note:b.name,date:ymd(new Date(y,m,d)),bill:b.id});ch=1});if(ch)save()}
function accsHTML(){return '<div class="card"><b>'+t('accBal')+'</b><div class="tiles">'+S.accs.map(a=>{const v=accBal(a.id);return '<div class="tile" onclick="sa=sa==\''+a.id+'\'?\'\':\''+a.id+'\';go(\'home\')" style="background:'+accColor(a)+(sa==a.id?';outline:3px solid var(--tx);outline-offset:2px':'')+'"><small>'+nm(a)+'</small><b>'+fmt(v)+'</b></div>'}).join('')+'<div class="tile add" onclick="tab=\'more\';sv=\'accs\';go()">+ '+t('addAcc')+'</div></div></div>'}
function allBudgets(){return (S.budgets||[]).map(b=>Object.assign({},b,{own:1})).concat(S.cats.filter(c=>c.budget>0&&vis(c)).map(c=>({id:c.id,name:cl(c),amt:c.budget,cats:[c.id],acc:''})))}
const bIn=(b,x)=>(!b.acc||b.acc==x.acc)&&b.cats.some(id=>id==x.cat||cat(x.cat).parent==id);
const bSpent=b=>S.tx.filter(x=>x.type=='exp'&&x.date.slice(0,7)==ym()&&bIn(b,x)).reduce((n,x)=>n+x.amt,0);
function budBar(b,click){const v=bSpent(b),p=v/b.amt;return '<div class="item" style="display:block"'+(click?' onclick="budSheet(\''+b.id+'\')"':'')+'><div class="row" style="margin:0;justify-content:space-between"><b>'+b.name+'</b><small>'+fmt(v)+' / '+fmt(b.amt)+'</small></div><div class="prog"><i style="width:'+Math.min(100,p*100)+'%;background:'+(p>=1?'var(--exp)':p>=0.8?'var(--acc)':'var(--inc)')+'"></i></div><small style="color:var(--mut)">'+(p>=1?t('over')+' '+fmt(v-b.amt):t('left')+' '+fmt(b.amt-v))+' • '+Math.round(p*100)+'%</small></div>'}
function budgetsHTML(){const l=allBudgets();return l.length?'<div class="card"><b>'+t('pBud')+'</b>'+l.map(b=>budBar(b,b.own)).join('')+'</div>':''}
function budSheet(id){const b=(S.budgets||[]).find(x=>x.id==id)||{cats:[]};const gs=S.cats.filter(c=>!c.parent&&vis(c)&&c.kind!='inc');$('M').innerHTML='<div class="sheet"><h3>'+(id?t('edit'):t('addBud'))+'</h3><label>'+t('name')+'</label><input id="bn" value="'+esc(b.name)+'"><label>'+t('amt')+'</label><input id="ba" type="number" inputmode="decimal" value="'+(b.amt||'')+'"><label>'+t('bAcc')+'</label><select id="bc0"><option value="">'+t('allAcc')+'</option>'+S.accs.map(a=>'<option value="'+a.id+'"'+(a.id==b.acc?' selected':'')+'>'+nm(a)+'</option>').join('')+'</select><label>'+t('bCats')+'</label>'+gs.map(c=>'<label class="item" style="color:var(--tx)">'+cic(c)+'<span class="grow">'+nm(c)+'</span><input type="checkbox" id="bk'+c.id+'" style="width:22px;margin:0"'+(b.cats.includes(c.id)?' checked':'')+'></label>').join('')+'<div class="row"><button class="btn" onclick="budSave(\''+(id||'')+'\')">'+t('save')+'</button>'+(id?'<button class="ghost" style="color:var(--exp)" onclick="S.budgets=S.budgets.filter(x=>x.id!=\''+id+'\');save();closeM();go()">'+t('del')+'</button>':'')+'<button class="ghost" onclick="closeM()">'+t('cancel')+'</button></div></div>';$('M').className='show'}
function budSave(id){const n=$('bn').value.trim(),a=+$('ba').value,cs=S.cats.filter(c=>!c.parent&&$('bk'+c.id)&&$('bk'+c.id).checked).map(c=>c.id);if(!n||!(a>0)||!cs.length){toast(t('bReq'));return}const r={name:n,amt:a,acc:$('bc0').value,cats:cs},b=S.budgets.find(x=>x.id==id);if(b)Object.assign(b,r);else S.budgets.push(Object.assign({id:uid()},r));save();closeM();go()}
const HC=['bal','safe','nw','accs','trend','chart','budg','bills','recent'];
function hcOrder(){const o=(S.home&&S.home.order)||HC;return o.concat(HC.filter(x=>!o.includes(x)))}
function hcMove(k,d){const o=hcOrder(),i=o.indexOf(k),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];S.home=Object.assign({off:[]},S.home,{order:o});save();go()}
function hcToggle(k){const f=(S.home&&S.home.off)||[];S.home=Object.assign({order:hcOrder()},S.home,{off:f.includes(k)?f.filter(x=>x!=k):f.concat(k)});save();go()}
function balCard(){const m=S.tx.filter(x=>x.date.slice(0,7)==ym()),i=sum(m,'inc'),e=sum(m,'exp');return '<div class="card hero"><small>'+t('bal')+'</small><div class="big">'+fmt(i-e)+'</div><div class="cols"><div>'+t('inc')+'<b>'+fmt(i)+'</b></div><div>'+t('exp')+'<b>'+fmt(e)+'</b></div></div></div>'}
function chartCard(){const m=S.tx.filter(x=>x.type=='exp'&&x.date.slice(0,7)==ym()),by={};m.forEach(x=>{const c=cat(x.cat),k=c.parent||c.id;by[k]=(by[k]||0)+x.amt});const ks=Object.keys(by).sort((a,b)=>by[b]-by[a]),tot=m.reduce((n,x)=>n+x.amt,0);return ks.length?'<div class="card"><b>'+t('byCat')+' • '+t('month')+'</b>'+donut(by,ks,tot)+'</div>':''}
function recentCard(){const l=mergeRows(S.tx,S.xfers||[],8);return '<div class="card"><b>'+t('recent')+'</b>'+(l||'<div class="empty">'+t('none')+'</div>')+'</div>'}
function homeHTML(){const off=(S.home&&S.home.off)||[];const F={safe:safeCard,nw:nwCard,bal:balCard,accs:accsHTML,trend:trendHTML,chart:chartCard,budg:budgetsHTML,bills:()=>{const u=billsHTML(false);return u?'<div class="card"><b>'+t('upcoming')+'</b>'+u+'</div>':''},recent:recentCard};return '<h1>'+(S.lang=='ar'?'قرشين':'Qirshain')+'</h1>'+hcOrder().filter(k=>!off.includes(k)).map(k=>F[k]()).join('')}
function plansHTML(){const hd=(ti,ac,lb)=>'<div class="row" style="justify-content:space-between;align-items:center;margin:0"><b>'+ti+'</b><button class="sm" onclick="'+ac+'">+ '+lb+'</button></div>';const bl=allBudgets().map(b=>budBar(b,b.own)).join('');
return '<h1>'+t('plans')+'</h1><div class="card">'+hd(t('pBud'),'budSheet()',t('addBud'))+(bl||'<div class="empty">'+t('noBud')+'</div>')+'</div><div class="card">'+hd(t('goals'),'goalForm()',t('addGoal'))+(S.goals.length?S.goals.map(g=>'<div class="item" style="display:block" onclick="goalSheet(\''+g.id+'\')"><div class="row" style="margin:0;justify-content:space-between"><b>'+g.name+'</b><small>'+Math.min(100,Math.round(g.saved/g.target*100))+'%</small></div><small style="color:var(--mut)">'+fmt(g.saved)+' / '+fmt(g.target)+' • '+t('left')+' '+fmt(Math.max(0,g.target-g.saved))+'</small><div class="prog"><i style="width:'+Math.min(100,g.saved/g.target*100)+'%"></i></div></div>').join(''):'<div class="empty">—</div>')+'</div><div class="card">'+hd(t('bills'),'billForm()',t('addBill'))+(billsHTML(true)||'<div class="empty">—</div>')+'</div>'}
function cmp(a,tot){const P=rng=='week'?[new Date(a.getFullYear(),a.getMonth(),a.getDate()-7),new Date(a.getFullYear(),a.getMonth(),a.getDate()-1)]:[new Date(a.getFullYear(),a.getMonth()-1,1),new Date(a.getFullYear(),a.getMonth(),0)];const pt=S.tx.filter(x=>x.type=='exp'&&x.date>=ymd(P[0])&&x.date<=ymd(P[1])&&fin(x.cat)).reduce((s,x)=>s+x.amt,0);if(!pt)return '';const d=Math.round((tot-pt)/pt*100);return '<small style="color:var(--mut)">'+t('vsPrev')+' <b class="'+(d>0?'e':'i')+'">'+(d>0?'+':'')+d+'%</b> ('+fmt(pt)+')</small>'}

function toggleCat(id){const c=S.cats.find(x=>x.id==id);c.hidden=!c.hidden;save();go()}
function curForm(){form(t('custom'),[{k:'c',l:t('cur'),v:S.cur}],v=>{if(!v.c)return false;S.cur=v.c})}
function libSheet(){$('M').innerHTML='<div class="sheet"><h3>'+t('lib')+'</h3><small style="color:var(--mut)">'+t('libHint')+'</small>'+S.lib.map((g,i)=>{const ex=S.cats.some(c=>!c.parent&&c.ar==g[1]);return '<div class="item" onclick="libGroup('+i+')"><div class="ic" style="background:'+g[2]+';border-radius:50%">'+g[0]+'</div><div class="grow"><b>'+g[1]+'</b><small>'+g[3].length+' '+t('subCats')+(ex?' • ✓':'')+'</small></div><span>'+(S.lang=='ar'?'‹':'›')+'</span></div>'}).join('')+'<div class="row"><button class="btn" onclick="S.lib.forEach((_,i)=>libPut(i));save();closeM();go()">'+t('addAll')+'</button><button class="ghost" onclick="closeM()">'+t('cancel')+'</button></div></div>';$('M').className='show'}
function libGroup(i){const g=S.lib[i],ex=S.cats.find(c=>!c.parent&&c.ar==g[1]);$('M').innerHTML='<div class="sheet"><div class="row" style="margin:0;align-items:center"><div class="ic" style="background:'+g[2]+';border-radius:50%">'+g[0]+'</div><h3 style="margin:0">'+g[1]+'</h3></div><h3 style="font-size:14px;color:var(--mut)">'+t('subCats')+'</h3>'+g[3].map((x,k)=>{const [e,n]=sp(x),has=ex&&S.cats.some(c=>c.parent==ex.id&&c.ar==n);return '<label class="item" style="color:var(--tx)"><div class="ic" style="background:'+g[2]+'33;border-radius:50%">'+e+'</div><span class="grow">'+n+'</span><input type="checkbox" id="ls'+k+'" style="width:22px;margin:0"'+(has?' disabled':' checked')+'></label>'}).join('')+'<div class="row"><button class="btn" onclick="libAdd('+i+')">'+t('addSel')+'</button><button class="ghost" onclick="libSheet()">'+t('cancel')+'</button></div></div>';$('M').className='show'}
function libAdd(i){const g=S.lib[i];let p=S.cats.find(c=>!c.parent&&c.ar==g[1]);if(!p){p={id:uid(),parent:'',ar:g[1],en:g[1],ic:g[0],color:g[2],kind:g[4]||'exp',budget:0};S.cats.push(p)}g[3].forEach((x,k)=>{const [e,n]=sp(x);if($('ls'+k).checked&&!S.cats.some(c=>c.parent==p.id&&c.ar==n))S.cats.push({id:uid(),parent:p.id,ar:n,en:n,ic:e,budget:0})});save();closeM();go()}
function libPut(i){const g=S.lib[i];let p=S.cats.find(c=>!c.parent&&c.ar==g[1]);if(!p){p={id:uid(),parent:'',ar:g[1],en:g[1],ic:g[0],color:g[2],kind:g[4]||'exp',budget:0};S.cats.push(p)}g[3].forEach(x=>{const [e,n]=sp(x);if(!S.cats.some(c=>c.parent==p.id&&c.ar==n))S.cats.push({id:uid(),parent:p.id,ar:n,en:n,ic:e=='•'?'':e,budget:0})})}
function libCustom(c){S.lib=S.lib||[];if(!c.parent){if(!S.lib.some(g=>g[1]==c.ar))S.lib.push([c.ic||'🏷️',c.ar,c.color||'#6B7280',[],c.kind||'exp'])}else{const p=S.cats.find(x=>x.id==c.parent);if(!p)return;let g=S.lib.find(x=>x[1]==p.ar);if(!g){g=[p.ic||'🏷️',p.ar,p.color||'#6B7280',[],p.kind||'exp'];S.lib.push(g)}if(!g[3].some(x=>sp(x)[1]==c.ar))g[3].push((c.ic||'•')+' '+c.ar)}}

function donut(by,ks,tot){if(!ks.length)return '';let a=0;const seg=ks.map((k,i)=>{const p=by[k]/tot*100,r=PAL[i%PAL.length]+' '+a+'% '+(a+p)+'%';a+=p;return r}).join(',');return '<div style="display:flex;align-items:center;gap:14px;margin:10px 0"><div style="width:120px;height:120px;border-radius:50%;background:conic-gradient('+seg+');display:grid;place-items:center;flex:none"><div style="width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:11px;padding:4px"><span>'+nm(cat(ks[0]))+'<br><b class="e">'+Math.round(by[ks[0]]/tot*100)+'%</b></span></div></div><div class="grow">'+ks.slice(0,5).map((k,i)=>'<div style="font-size:13px;display:flex;gap:6px;align-items:center;margin:3px 0"><i style="width:10px;height:10px;border-radius:3px;background:'+PAL[i%PAL.length]+'"></i>'+nm(cat(k))+'<small style="margin-inline-start:auto">'+Math.round(by[k]/tot*100)+'%</small></div>').join('')+'</div></div>'}
